name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The three checks every repository owes, held once in the framework.
  checks:
    uses: d-fiber/scribe/.github/workflows/gate.yml@49b44ce030426789b2e9939b3413faacef57c973
    with:
      excluded: ".git .dart_tool build .idea android ios linux macos windows"
      extensions: "dart sh"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Format, analyse, test and build the site
        run: bash tool/test.sh




  release:
    needs: [verify, checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Write what this version is made of, if it has moved
        run: |
          set -eu
          bash .github/version/changelog.sh

          git diff --quiet CHANGELOG.md && exit 0

          version=$(awk '/^version:/ { print $2; exit }' app/pubspec.yaml | cut -d+ -f1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "[DOC]: write what $version is made of"
          git push origin HEAD:dev

      - name: Name this commit after the version, if it has moved
        run: bash .github/version/tag.sh
