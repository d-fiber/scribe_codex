name: publish

on:
  workflow_call:
    inputs:
      version:
        description: The version being published, as three numbers.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Build the site
        run: |
          set -eu
          flutter pub get
          cd app
          flutter build web --release --output "$GITHUB_WORKSPACE/build/web"

      - name: Check that what was built is a site somebody can serve
        run: |
          set -eu
          [ -f build/web/index.html ] || { echo "the build holds no index.html" >&2; exit 1; }
          [ -f build/web/main.dart.js ] || { echo "the build holds no compiled entry" >&2; exit 1; }
          echo "the build holds $(find build/web -type f | wc -l | tr -d ' ') files, index and entry included"

      - name: Pack it under the name the framework serves it from
        run: |
          set -eu
          mkdir -p pack/codex
          cp -R build/web/. pack/codex/
          tar -czf scribe-codex.tar.gz -C pack codex
          ls -lh scribe-codex.tar.gz

      - name: Attach it to this release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "v$VERSION" scribe-codex.tar.gz --clobber --repo ${{ github.repository }}
