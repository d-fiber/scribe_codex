name: sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check that the key this needs is here
        env:
          KEY: ${{ secrets.CODEX_PUSH_KEY }}
        run: |
          set -eu
          [ -n "$KEY" ] && exit 0
          echo "CODEX_PUSH_KEY is not set on this repository, and nothing can be copied without it." >&2
          echo "" >&2
          echo "It is the private half of the deploy key named \"codex sync\", with write access on d-fiber/scribe." >&2
          echo "Without it the push to dev is refused like anybody else's." >&2
          echo "" >&2
          echo "Nothing was built." >&2
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Build the site
        run: |
          set -eu
          flutter pub get
          cd app
          flutter build web --release --output "$GITHUB_WORKSPACE/build/web"

      - name: Check that what was built is a site somebody can serve
        run: |
          set -eu
          [ -f build/web/index.html ] || { echo "the build holds no index.html" >&2; exit 1; }
          [ -f build/web/main.dart.js ] || { echo "the build holds no compiled entry" >&2; exit 1; }
          echo "the build holds $(find build/web -type f | wc -l | tr -d ' ') files, index and entry included"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: d-fiber/scribe
          ref: dev
          path: scribe
          ssh-key: ${{ secrets.CODEX_PUSH_KEY }}

      - name: Copy the site where the framework serves it from
        run: |
          set -eu
          mkdir -p scribe/web/codex
          rsync -a --delete build/web/ scribe/web/codex/

      - name: Leave if the framework already holds this build
        id: state
        working-directory: scribe
        run: |
          set -eu
          if [ -z "$(git status --porcelain -- web/codex)" ]; then
            echo "the framework already holds this build"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- web/codex
          fi

      - name: Put it on dev
        if: steps.state.outputs.changed == 'true'
        working-directory: scribe
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/codex
          git commit -m "[CHORE]: bring the dashboard up to ${GITHUB_SHA:0:7}"
          git pull --rebase origin dev
          git push origin HEAD:dev
